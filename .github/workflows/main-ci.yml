name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI Pipeline
    uses: ./.github/workflows/shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      statuses: write
      security-events: write

  update-pdfs:
    name: Commit PDFs
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: get-pdfs-artifacts-ids
        name: Get PDFs Artifacts IDs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATED_PDFS: ${{ needs.ci.outputs.generated-pdfs }}
        with:
          result-encoding: string
          script: |
            const generatedPdfs = JSON.parse(process.env.GENERATED_PDFS);
            return generatedPdfs.map(pdf => pdf["artifact-id"]).join(',');

            return artifactIds;

      - name: Download PDFs
        id: download-pdfs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.get-pdfs-artifacts-ids.outputs.result }}
          path: ${{ runner.temp }}/generated-pdfs-${{ github.run_id }}

      - name: Copy generated PDFs
        env:
          DOWNLOAD_PATH: ${{ steps.download-pdfs.outputs.download-path }}
          DESTINATION_PATH: ${{ needs.ci.outputs.pdfs-root-path }}
        run: |
          ls -la "${DOWNLOAD_PATH}"/**/*.pdf
          rm -f "${DESTINATION_PATH}"/*.pdf
          cp "${DOWNLOAD_PATH}"/**/*.pdf "${DESTINATION_PATH}"/
          ls -la "${DESTINATION_PATH}"

      - name: Upload resumes artifact
        id: upload-resumes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumes
          path: |
            resume/resume.*.json
            resume/pdf/resume.*.pdf
          if-no-files-found: error

      - uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@ab69f41f76e77ec84e733dedb03492b3ee95a05f # 0.39.0
        with:
          branch: chore/update-resume-pdfs
          commit-message: "chore(resume): update generated resume PDFs"
          title: "chore(resume): update generated resume PDFs"
          body: |
            This PR updates the generated resume PDF files.

            The PDFs are generated automatically from the JSON resume data.

            [skip ci]

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] GitHub App key is intentionally repository-scoped for this automation workflow.
          owner: ${{ github.repository_owner }}
          repositories: escemi-website
          permission-contents: write

      - name: Dispatch sync-resumes event
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: sync-resumes
          token: ${{ steps.generate-token.outputs.token }}
          repository: ${{ github.repository_owner }}/escemi-website
          client-payload: |
            {
              "repository": ${{ toJson(github.repository) }},
              "run-id": ${{ toJson(github.run_id) }},
              "artifact-id": ${{ toJson(steps.upload-resumes.outputs.artifact-id) }}
            }
